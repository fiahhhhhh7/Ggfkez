<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4D Hypercube (Tesseract) Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', 'Segoe UI', 'Roboto', sans-serif;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 44px;
      padding: 20px;
      max-width: 960px;
      width: 100%;
    }

    /* 左側高解析度畫布區域 */
    .canvas-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    canvas {
      display: block;
      width: 420px;
      height: 420px;
    }

    /* 右側控制面板 */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 26px;
      width: 340px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .axis-label {
      font-size: 24px;
      font-weight: 500;
      color: #111111;
      width: 22px;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      flex-shrink: 0;
    }

    /* 自訂滑桿軌道 */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 8px;
      background: #b5b5b5;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      touch-action: none;
    }

    /* 自訂滑桿圓點 (WebKit) */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }

    /* 自訂滑桿圓點 (Firefox) */
    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    /* 四個軸對應的圓點顏色 */
    #slider-x::-webkit-slider-thumb { background: #ff1e1e; }
    #slider-x::-moz-range-thumb { background: #ff1e1e; }

    #slider-y::-webkit-slider-thumb { background: #3b4cca; }
    #slider-y::-moz-range-thumb { background: #3b4cca; }

    #slider-z::-webkit-slider-thumb { background: #1ec828; }
    #slider-z::-moz-range-thumb { background: #1ec828; }

    #slider-w::-webkit-slider-thumb { background: #ffe159; }
    #slider-w::-moz-range-thumb { background: #ffe159; }

    /* 數值輸入框 */
    .value-input-group {
      display: flex;
      align-items: center;
      background: #f2f2f2;
      border-radius: 8px;
      padding: 4px 8px;
      width: 74px;
      flex-shrink: 0;
      border: 1px solid transparent;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .value-input-group:focus-within {
      background: #ffffff;
      border-color: #999999;
    }

    .angle-input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #222222;
      text-align: right;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      -moz-appearance: textfield;
    }

    .angle-input::-webkit-outer-spin-button,
    .angle-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .degree-symbol {
      font-size: 14px;
      font-weight: 400;
      color: #666666;
      margin-left: 2px;
      font-family: 'Poppins', sans-serif;
    }

    /* Reset 按鈕 */
    .button-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    button#reset-btn {
      background-color: #c2c2c2;
      color: #111111;
      border: none;
      border-radius: 999px;
      padding: 10px 34px;
      font-family: 'Poppins', sans-serif;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button#reset-btn:hover {
      background-color: #b0b0b0;
    }

    button#reset-btn:active {
      transform: scale(0.96);
    }

    /* 響應式調整：螢幕較窄或直向螢幕時改為上下排列，但保持完全固定不捲動 */
    @media (max-width: 820px) {
      .container {
        flex-direction: column;
        gap: 16px;
        padding: 12px;
      }
      canvas {
        width: 300px;
        height: 300px;
      }
      .controls {
        width: 310px;
        gap: 18px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="canvas-wrapper">
      <canvas id="tesseractCanvas"></canvas>
    </div>

    <div class="controls">
      <div class="slider-row">
        <span class="axis-label">x</span>
        <input type="range" id="slider-x" min="-180" max="180" step="0.5" value="0">
        <div class="value-input-group">
          <input type="number" id="input-x" class="angle-input" min="-360" max="360" step="0.5" value="0">
          <span class="degree-symbol">°</span>
        </div>
      </div>

      <div class="slider-row">
        <span class="axis-label">y</span>
        <input type="range" id="slider-y" min="-180" max="180" step="0.5" value="0">
        <div class="value-input-group">
          <input type="number" id="input-y" class="angle-input" min="-360" max="360" step="0.5" value="0">
          <span class="degree-symbol">°</span>
        </div>
      </div>

      <div class="slider-row">
        <span class="axis-label">z</span>
        <input type="range" id="slider-z" min="-180" max="180" step="0.5" value="0">
        <div class="value-input-group">
          <input type="number" id="input-z" class="angle-input" min="-360" max="360" step="0.5" value="0">
          <span class="degree-symbol">°</span>
        </div>
      </div>

      <div class="slider-row">
        <span class="axis-label">w</span>
        <input type="range" id="slider-w" min="-180" max="180" step="0.5" value="0">
        <div class="value-input-group">
          <input type="number" id="input-w" class="angle-input" min="-360" max="360" step="0.5" value="0">
          <span class="degree-symbol">°</span>
        </div>
      </div>

      <div class="button-wrapper">
        <button id="reset-btn">reset</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tesseractCanvas');
    const ctx = canvas.getContext('2d');

    const axes = ['x', 'y', 'z', 'w'];
    const sliders = {};
    const inputs = {};

    axes.forEach(axis => {
      sliders[axis] = document.getElementById(`slider-${axis}`);
      inputs[axis] = document.getElementById(`input-${axis}`);
    });

    const resetBtn = document.getElementById('reset-btn');

    // 預設角度為 0, 0, 0, 0
    const INITIAL_ANGLES = { x: 0, y: 0, z: 0, w: 0 };
    const state = { ...INITIAL_ANGLES };

    // 1. 高解析度 Canvas 設定（支援 Retina / HiDPI 螢幕，預設至少 2x 超取樣抗鋸齒）
    let logicalSize = 420;
    function setupHighResCanvas() {
      const rect = canvas.getBoundingClientRect();
      logicalSize = rect.width || 420;
      const dpr = Math.max(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(logicalSize * dpr);
      canvas.height = Math.round(logicalSize * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      render();
    }

    // 2. 建立超立方體的 16 個四維頂點 (x, y, z, w ∈ {-1, 1})
    const vertices = [];
    for (let i = 0; i < 16; i++) {
      vertices.push([
        (i & 1) ? 1 : -1,
        (i & 2) ? 1 : -1,
        (i & 4) ? 1 : -1,
        (i & 8) ? 1 : -1
      ]);
    }

    // 3. 建立 32 條邊（漢明距離為 1 的頂點相連）
    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i + 1; j < 16; j++) {
        let diff = 0;
        for (let k = 0; k < 4; k++) {
          if (vertices[i][k] !== vertices[j][k]) diff++;
        }
        if (diff === 1) {
          edges.push([i, j]);
        }
      }
    }

    // 4. 四維旋轉矩陣運算（輸入為角度制，內部轉為弧度）
    function degToRad(deg) {
      return (deg * Math.PI) / 180;
    }

    function rotate4D(point, degX, degY, degZ, degW) {
      let [x, y, z, w] = point;
      const ax = degToRad(degX);
      const ay = degToRad(degY);
      const az = degToRad(degZ);
      const aw = degToRad(degW);

      let t1, t2;

      // W 軸：XW 平面旋轉
      if (aw !== 0) {
        t1 = x * Math.cos(aw) - w * Math.sin(aw);
        t2 = x * Math.sin(aw) + w * Math.cos(aw);
        x = t1;
        w = t2;
      }

      // X 軸：YZ 平面旋轉
      if (ax !== 0) {
        t1 = y * Math.cos(ax) - z * Math.sin(ax);
        t2 = y * Math.sin(ax) + z * Math.cos(ax);
        y = t1;
        z = t2;
      }

      // Y 軸：XZ 平面旋轉
      if (ay !== 0) {
        t1 = x * Math.cos(ay) + z * Math.sin(ay);
        t2 = -x * Math.sin(ay) + z * Math.cos(ay);
        x = t1;
        z = t2;
      }

      // Z 軸：XY 平面旋轉
      if (az !== 0) {
        t1 = x * Math.cos(az) - y * Math.sin(az);
        t2 = x * Math.sin(az) + y * Math.cos(az);
        x = t1;
        y = t2;
      }

      return [x, y, z, w];
    }

    // 5. 繪製超立方體
    function render() {
      ctx.clearRect(0, 0, logicalSize, logicalSize);

      const projected = [];
      const scale = logicalSize * 0.86;

      for (let i = 0; i < vertices.length; i++) {
        const [x, y, z, w] = rotate4D(
          vertices[i],
          state.x,
          state.y,
          state.z,
          state.w
        );

        // 4D -> 3D 透視投影
        const distance4D = 2.8;
        const factor4D = 1 / (distance4D - w);
        const x3 = x * factor4D;
        const y3 = y * factor4D;
        const z3 = z * factor4D;

        // 3D -> 2D 透視投影
        const distance3D = 2.6;
        const factor3D = 1 / (distance3D - z3);

        const screenX = logicalSize / 2 + x3 * factor3D * scale;
        const screenY = logicalSize / 2 + y3 * factor3D * scale;

        projected.push({
          x: screenX,
          y: screenY,
          depthFactor: factor4D * factor3D
        });
      }

      // 繪製 32 條邊線
      for (const [i, j] of edges) {
        const p1 = projected[i];
        const p2 = projected[j];
        const avgDepth = (p1.depthFactor + p2.depthFactor) / 2;

        const normalized = Math.min(Math.max((avgDepth - 0.1) / 0.25, 0), 1);
        const lineWidth = 0.65 + normalized * 1.35;
        const grayValue = Math.round(145 - normalized * 125);

        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = `rgb(${grayValue}, ${grayValue}, ${grayValue})`;
        ctx.lineWidth = lineWidth;
        ctx.stroke();
      }

      // 繪製 16 個頂點圓圈（依深度由遠到近繪製）
      const sortedIndices = projected
        .map((_, idx) => idx)
        .sort((a, b) => projected[a].depthFactor - projected[b].depthFactor);

      const nodeColors = ['#ffffff', '#eef6ee', '#e6e8fa', '#f4f4f8'];

      for (const idx of sortedIndices) {
        const p = projected[idx];
        const normalized = Math.min(Math.max((p.depthFactor - 0.1) / 0.25, 0), 1);
        const radius = 2.7 + normalized * 2.3;
        const borderGray = Math.round(110 - normalized * 95);

        ctx.beginPath();
        ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        ctx.fillStyle = nodeColors[idx % nodeColors.length];
        ctx.fill();

        ctx.lineWidth = 0.95 + normalized * 0.7;
        ctx.strokeStyle = `rgb(${borderGray}, ${borderGray}, ${borderGray})`;
        ctx.stroke();
      }
    }

    // 6. 雙向同步滑桿與數值輸入框
    function normalizeDegrees(deg) {
      let val = parseFloat(deg);
      if (isNaN(val)) return 0;
      val = ((val + 180) % 360 + 360) % 360 - 180;
      if (val === -180 && parseFloat(deg) > 0) val = 180;
      return Math.round(val * 100) / 100;
    }

    axes.forEach(axis => {
      sliders[axis].addEventListener('input', () => {
        const val = parseFloat(sliders[axis].value);
        state[axis] = val;
        inputs[axis].value = val;
        render();
      });

      inputs[axis].addEventListener('input', () => {
        const raw = inputs[axis].value;
        if (raw === '' || raw === '-') return;
        const val = parseFloat(raw);
        if (!isNaN(val)) {
          state[axis] = val;
          sliders[axis].value = Math.max(-180, Math.min(180, val));
          render();
        }
      });

      const commitInput = () => {
        const normalized = normalizeDegrees(inputs[axis].value);
        state[axis] = normalized;
        inputs[axis].value = normalized;
        sliders[axis].value = normalized;
        render();
      };

      inputs[axis].addEventListener('change', commitInput);
      inputs[axis].addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          commitInput();
          inputs[axis].blur();
        }
      });
    });

    // 7. Reset 按鈕邏輯（全部歸零為 0, 0, 0, 0）
    function resetAll() {
      axes.forEach(axis => {
        state[axis] = INITIAL_ANGLES[axis];
        sliders[axis].value = INITIAL_ANGLES[axis];
        inputs[axis].value = INITIAL_ANGLES[axis];
      });
      render();
    }

    resetBtn.addEventListener('click', resetAll);

    // 防止行動裝置在畫布或空白處觸發頁面捲動
    document.addEventListener('touchmove', (e) => {
      if (e.target.tagName !== 'INPUT') {
        e.preventDefault();
      }
    }, { passive: false });

    // 初始化與視窗大小變更監聽
    window.addEventListener('resize', setupHighResCanvas);
    setupHighResCanvas();
  </script>
</body>
</html>
