<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>4D Hypercube (Tesseract) Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    /* 預設直向視窗容器 */
    .app-frame {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 920px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
      align-items: center;
      padding: 24px 34px 32px 34px;
      position: relative;
    }

    /* 左／上：超立方體畫布 + 四軸方向指示器 */
    .viewport-section {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    canvas#tesseractCanvas {
      display: block;
      width: min(320px, 72vw, 42vh);
      height: min(320px, 72vw, 42vh);
      cursor: grab;
    }

    canvas#tesseractCanvas.dragging {
      cursor: grabbing;
    }

    /* 四軸方向指示器 (Red: x, Blue: y, Green: z, Yellow: w) */
    canvas#axisGizmo {
      position: absolute;
      right: 4px;
      bottom: 4px;
      width: 82px;
      height: 82px;
      pointer-events: none;
    }

    /* 右／下：控制滑桿區塊 */
    .controls-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex-shrink: 0;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    /* 左側標籤與無框可輸入數值 */
    .label-value-group {
      display: flex;
      align-items: baseline;
      width: 82px;
      flex-shrink: 0;
      font-size: 22px;
      font-weight: 500;
      color: #111111;
    }

    .axis-prefix {
      letter-spacing: 0.5px;
      margin-right: 4px;
    }

    .angle-input {
      width: 56px;
      border: none;
      border-bottom: 1.5px solid transparent;
      background: transparent;
      font-family: 'Poppins', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: #111111;
      padding: 0;
      outline: none;
      user-select: text;
      -webkit-user-select: text;
      -moz-appearance: textfield;
      transition: border-color 0.15s ease;
    }

    .angle-input:hover,
    .angle-input:focus {
      border-bottom-color: #999999;
    }

    .angle-input::-webkit-outer-spin-button,
    .angle-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* 滑桿軌道 */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 8px;
      background: #bdbdbd;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
      touch-action: none;
    }

    /* 滑桿圓點 (WebKit) */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }

    /* 滑桿圓點 (Firefox) */
    input[type="range"]::-moz-range-thumb {
      width: 21px;
      height: 21px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    /* 四個軸圓點配色：w 黃、x 紅、y 藍、z 綠 */
    #slider-w::-webkit-slider-thumb { background: #ffe366; }
    #slider-w::-moz-range-thumb { background: #ffe366; }

    #slider-x::-webkit-slider-thumb { background: #ff1e1e; }
    #slider-x::-moz-range-thumb { background: #ff1e1e; }

    #slider-y::-webkit-slider-thumb { background: #3b4cca; }
    #slider-y::-moz-range-thumb { background: #3b4cca; }

    #slider-z::-webkit-slider-thumb { background: #1ec828; }
    #slider-z::-moz-range-thumb { background: #1ec828; }

    /* Reset 按鈕列 */
    .footer-row {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }

    button#reset-btn {
      background-color: #c2c2c2;
      color: #111111;
      border: none;
      border-radius: 999px;
      padding: 7px 22px;
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    button#reset-btn:hover {
      background-color: #b0b0b0;
    }

    button#reset-btn:active {
      transform: scale(0.95);
    }

    /* 電腦與橫式螢幕版面：立方體在左邊，bar 在右邊 */
    @media (orientation: landscape) and (min-width: 640px) {
      body {
        background-color: #ffffff;
      }

      .app-frame {
        width: 100%;
        max-width: 1120px;
        height: 100%;
        max-height: 780px;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 56px;
        padding: 36px 48px;
      }

      .viewport-section {
        width: auto;
        flex: 1.1;
        height: 100%;
        max-width: 540px;
      }

      canvas#tesseractCanvas {
        width: min(440px, 44vw, 76vh);
        height: min(440px, 44vw, 76vh);
      }

      canvas#axisGizmo {
        right: 12px;
        bottom: 12px;
        width: 96px;
        height: 96px;
      }

      .controls-section {
        flex: 0.9;
        width: auto;
        max-width: 400px;
        gap: 28px;
        justify-content: center;
      }

      .footer-row {
        margin-top: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="app-frame">
    <!-- 左／上：超立方體主畫布與軸向指示器 -->
    <div class="viewport-section">
      <canvas id="tesseractCanvas" width="640" height="640"></canvas>
      <canvas id="axisGizmo" width="164" height="164"></canvas>
    </div>

    <!-- 右／下：控制項：順序為 w, x, y, z -->
    <div class="controls-section">
      <div class="slider-row">
        <div class="label-value-group">
          <span class="axis-prefix">w:</span>
          <input type="number" id="input-w" class="angle-input" min="-360" max="360" step="1" value="0">
        </div>
        <input type="range" id="slider-w" min="-180" max="180" step="1" value="0">
      </div>

      <div class="slider-row">
        <div class="label-value-group">
          <span class="axis-prefix">x:</span>
          <input type="number" id="input-x" class="angle-input" min="-360" max="360" step="1" value="0">
        </div>
        <input type="range" id="slider-x" min="-180" max="180" step="1" value="0">
      </div>

      <div class="slider-row">
        <div class="label-value-group">
          <span class="axis-prefix">y:</span>
          <input type="number" id="input-y" class="angle-input" min="-360" max="360" step="1" value="0">
        </div>
        <input type="range" id="slider-y" min="-180" max="180" step="1" value="0">
      </div>

      <div class="slider-row">
        <div class="label-value-group">
          <span class="axis-prefix">z:</span>
          <input type="number" id="input-z" class="angle-input" min="-360" max="360" step="1" value="0">
        </div>
        <input type="range" id="slider-z" min="-180" max="180" step="1" value="0">
      </div>

      <div class="footer-row">
        <button id="reset-btn">reset</button>
      </div>
    </div>
  </div>

  <script>
    const mainCanvas = document.getElementById('tesseractCanvas');
    const mainCtx = mainCanvas.getContext('2d');

    const gizmoCanvas = document.getElementById('axisGizmo');
    const gizmoCtx = gizmoCanvas.getContext('2d');

    const axes = ['w', 'x', 'y', 'z'];
    const sliders = {};
    const inputs = {};

    axes.forEach(axis => {
      sliders[axis] = document.getElementById(`slider-${axis}`);
      inputs[axis] = document.getElementById(`input-${axis}`);
    });

    const resetBtn = document.getElementById('reset-btn');

    // 預設角度為 0, 0, 0, 0
    const INITIAL_ANGLES = { w: 0, x: 0, y: 0, z: 0 };
    const state = { ...INITIAL_ANGLES };

    let mainLogicalSize = 320;
    let gizmoLogicalSize = 82;

    // 1. 高解析度 Canvas 初始化（具備安全最小尺寸防呆）
    function setupHighResCanvases() {
      const dpr = Math.max(window.devicePixelRatio || 1, 2);

      const mainRect = mainCanvas.getBoundingClientRect();
      const rawMainSize = Math.min(mainRect.width, mainRect.height);
      mainLogicalSize = rawMainSize >= 80 ? rawMainSize : 320;

      mainCanvas.width = Math.round(mainLogicalSize * dpr);
      mainCanvas.height = Math.round(mainLogicalSize * dpr);
      mainCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      mainCtx.lineCap = 'round';
      mainCtx.lineJoin = 'round';

      const gizmoRect = gizmoCanvas.getBoundingClientRect();
      const rawGizmoSize = Math.min(gizmoRect.width, gizmoRect.height);
      gizmoLogicalSize = rawGizmoSize >= 40 ? rawGizmoSize : 82;

      gizmoCanvas.width = Math.round(gizmoLogicalSize * dpr);
      gizmoCanvas.height = Math.round(gizmoLogicalSize * dpr);
      gizmoCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      gizmoCtx.lineCap = 'round';
      gizmoCtx.lineJoin = 'round';

      render();
    }

    // 2. 建立超立方體 16 個頂點與 32 條邊
    const vertices = [];
    for (let i = 0; i < 16; i++) {
      vertices.push([
        (i & 1) ? 1 : -1,
        (i & 2) ? 1 : -1,
        (i & 4) ? 1 : -1,
        (i & 8) ? 1 : -1
      ]);
    }

    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let j = i + 1; j < 16; j++) {
        let diff = 0;
        for (let k = 0; k < 4; k++) {
          if (vertices[i][k] !== vertices[j][k]) diff++;
        }
        if (diff === 1) edges.push([i, j]);
      }
    }

    // 3. 四維旋轉運算
    function degToRad(deg) {
      return (deg * Math.PI) / 180;
    }

    function rotate4D(point, degX, degY, degZ, degW) {
      let [x, y, z, w] = point;
      const ax = degToRad(degX);
      const ay = degToRad(degY);
      const az = degToRad(degZ);
      const aw = degToRad(degW);

      let t1, t2;

      // W 軸：XW 平面旋轉
      if (aw !== 0) {
        t1 = x * Math.cos(aw) - w * Math.sin(aw);
        t2 = x * Math.sin(aw) + w * Math.cos(aw);
        x = t1;
        w = t2;
      }

      // X 軸：YZ 平面旋轉
      if (ax !== 0) {
        t1 = y * Math.cos(ax) - z * Math.sin(ax);
        t2 = y * Math.sin(ax) + z * Math.cos(ax);
        y = t1;
        z = t2;
      }

      // Y 軸：XZ 平面旋轉
      if (ay !== 0) {
        t1 = x * Math.cos(ay) + z * Math.sin(ay);
        t2 = -x * Math.sin(ay) + z * Math.cos(ay);
        x = t1;
        z = t2;
      }

      // Z 軸：XY 平面旋轉
      if (az !== 0) {
        t1 = x * Math.cos(az) - y * Math.sin(az);
        t2 = x * Math.sin(az) + y * Math.cos(az);
        x = t1;
        y = t2;
      }

      return [x, y, z, w];
    }

    // 4. 共用的 4D -> 3D -> 2D 投影函式
    const DISTANCE_4D = 2.8;
    const DISTANCE_3D = 2.6;

    function projectPoint4Dto2D(point4D, centerX, centerY, scale) {
      const [rx, ry, rz, rw] = rotate4D(
        point4D,
        state.x,
        state.y,
        state.z,
        state.w
      );

      const factor4D = 1 / (DISTANCE_4D - rw);
      const x3 = rx * factor4D;
      const y3 = ry * factor4D;
      const z3 = rz * factor4D;

      const factor3D = 1 / (DISTANCE_3D - z3);
      const totalFactor = factor4D * factor3D;

      return {
        x: centerX + x3 * factor3D * scale,
        y: centerY + y3 * factor3D * scale,
        depthFactor: totalFactor
      };
    }

    // 5. 繪製主超立方體
    function renderTesseract() {
      mainCtx.clearRect(0, 0, mainLogicalSize, mainLogicalSize);

      const center = mainLogicalSize / 2;
      const scale = mainLogicalSize * 1.15;
      const projected = vertices.map(v => projectPoint4Dto2D(v, center, center, scale));

      for (const [i, j] of edges) {
        const p1 = projected[i];
        const p2 = projected[j];
        const avgDepth = (p1.depthFactor + p2.depthFactor) / 2;

        const normalized = Math.min(Math.max((avgDepth - 0.1) / 0.25, 0), 1);
        const lineWidth = 0.75 + normalized * 1.4;
        const grayValue = Math.round(145 - normalized * 125);

        mainCtx.beginPath();
        mainCtx.moveTo(p1.x, p1.y);
        mainCtx.lineTo(p2.x, p2.y);
        mainCtx.strokeStyle = `rgb(${grayValue}, ${grayValue}, ${grayValue})`;
        mainCtx.lineWidth = lineWidth;
        mainCtx.stroke();
      }

      const sortedIndices = projected
        .map((_, idx) => idx)
        .sort((a, b) => projected[a].depthFactor - projected[b].depthFactor);

      const nodeColors = ['#ffffff', '#eef6ee', '#e6e8fa', '#f4f4f8'];

      for (const idx of sortedIndices) {
        const p = projected[idx];
        const normalized = Math.min(Math.max((p.depthFactor - 0.1) / 0.25, 0), 1);
        const radius = 2.8 + normalized * 2.3;
        const borderGray = Math.round(110 - normalized * 95);

        mainCtx.beginPath();
        mainCtx.arc(p.x, p.y, radius, 0, Math.PI * 2);
        mainCtx.fillStyle = nodeColors[idx % nodeColors.length];
        mainCtx.fill();

        mainCtx.lineWidth = 1.0 + normalized * 0.65;
        mainCtx.strokeStyle = `rgb(${borderGray}, ${borderGray}, ${borderGray})`;
        mainCtx.stroke();
      }
    }

    // 6. 繪製四軸方向指示箭頭 (Gizmo)
    function drawArrow(ctx, fromX, fromY, toX, toY, color) {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const len = Math.hypot(dx, dy);
      if (len < 1.5) return;

      const angle = Math.atan2(dy, dx);
      const headLen = Math.min(6.2, len * 0.36);

      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(
        toX - headLen * Math.cos(angle - Math.PI / 6),
        toY - headLen * Math.sin(angle - Math.PI / 6)
      );
      ctx.lineTo(
        toX - headLen * Math.cos(angle + Math.PI / 6),
        toY - headLen * Math.sin(angle + Math.PI / 6)
      );
      ctx.closePath();
      ctx.fill();
    }

    function renderAxisGizmo() {
      gizmoCtx.clearRect(0, 0, gizmoLogicalSize, gizmoLogicalSize);

      const cx = gizmoLogicalSize / 2;
      const cy = gizmoLogicalSize / 2;
      const axisUnitLength = 1.0;
      const gizmoScale = gizmoLogicalSize * 1.15;

      const origin2D = projectPoint4Dto2D([0, 0, 0, 0], cx, cy, gizmoScale);

      const axisDefs = [
        { name: 'w', tip: [0, 0, 0, axisUnitLength], color: '#ffe366' },
        { name: 'x', tip: [axisUnitLength, 0, 0, 0], color: '#ff1e1e' },
        { name: 'y', tip: [0, axisUnitLength, 0, 0], color: '#3b4cca' },
        { name: 'z', tip: [0, 0, axisUnitLength, 0], color: '#1ec828' }
      ];

      const projectedAxes = axisDefs.map(def => {
        const tip2D = projectPoint4Dto2D(def.tip, cx, cy, gizmoScale);
        return {
          fromX: origin2D.x,
          fromY: origin2D.y,
          toX: tip2D.x,
          toY: tip2D.y,
          color: def.color,
          depthFactor: tip2D.depthFactor
        };
      });

      projectedAxes.sort((a, b) => a.depthFactor - b.depthFactor);
      for (const ax of projectedAxes) {
        drawArrow(gizmoCtx, ax.fromX, ax.fromY, ax.toX, ax.toY, ax.color);
      }
    }

    function render() {
      renderTesseract();
      renderAxisGizmo();
    }

    // 7. 角度正規化與控制項同步
    function normalizeDegrees(deg) {
      let val = parseFloat(deg);
      if (isNaN(val)) return 0;
      val = ((val + 180) % 360 + 360) % 360 - 180;
      if (val === -180 && parseFloat(deg) > 0) val = 180;
      return Math.round(val * 10) / 10;
    }

    function setAxisAngle(axis, deg, shouldNormalize = false) {
      const value = shouldNormalize ? normalizeDegrees(deg) : Math.round(parseFloat(deg) * 10) / 10;
      if (isNaN(value)) return;
      state[axis] = value;
      inputs[axis].value = value;
      sliders[axis].value = Math.max(-180, Math.min(180, value));
      render();
    }

    axes.forEach(axis => {
      sliders[axis].addEventListener('input', () => {
        setAxisAngle(axis, sliders[axis].value, false);
      });

      inputs[axis].addEventListener('input', () => {
        const raw = inputs[axis].value;
        if (raw === '' || raw === '-') return;
        const val = parseFloat(raw);
        if (!isNaN(val)) {
          state[axis] = val;
          sliders[axis].value = Math.max(-180, Math.min(180, val));
          render();
        }
      });

      const commitInput = () => {
        setAxisAngle(axis, inputs[axis].value, true);
      };

      inputs[axis].addEventListener('change', commitInput);
      inputs[axis].addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          commitInput();
          inputs[axis].blur();
        }
      });
    });

    // 8. 滑鼠拖曳方塊旋轉（x, y 軸）與滾輪控制 w 軸
    let isDragging = false;
    let lastPointerX = 0;
    let lastPointerY = 0;
    const DRAG_SENSITIVITY = 0.55;
    const WHEEL_SENSITIVITY = 0.05;

    mainCanvas.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
      isDragging = true;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;
      mainCanvas.classList.add('dragging');
      mainCanvas.setPointerCapture(e.pointerId);
    });

    mainCanvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastPointerX;
      const dy = e.clientY - lastPointerY;
      lastPointerX = e.clientX;
      lastPointerY = e.clientY;

      const nextY = normalizeDegrees(state.y + dx * DRAG_SENSITIVITY);
      const nextX = normalizeDegrees(state.x + dy * DRAG_SENSITIVITY);

      state.y = nextY;
      state.x = nextX;

      inputs.y.value = nextY;
      sliders.y.value = Math.max(-180, Math.min(180, nextY));

      inputs.x.value = nextX;
      sliders.x.value = Math.max(-180, Math.min(180, nextX));

      render();
    });

    function stopDragging(e) {
      if (!isDragging) return;
      isDragging = false;
      mainCanvas.classList.remove('dragging');
      if (e && mainCanvas.hasPointerCapture(e.pointerId)) {
        mainCanvas.releasePointerCapture(e.pointerId);
      }
    }

    mainCanvas.addEventListener('pointerup', stopDragging);
    mainCanvas.addEventListener('pointercancel', stopDragging);

    mainCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const nextW = normalizeDegrees(state.w + e.deltaY * WHEEL_SENSITIVITY);
      setAxisAngle('w', nextW, false);
    }, { passive: false });

    // 9. Reset 歸零
    resetBtn.addEventListener('click', () => {
      axes.forEach(axis => {
        state[axis] = INITIAL_ANGLES[axis];
        sliders[axis].value = INITIAL_ANGLES[axis];
        inputs[axis].value = INITIAL_ANGLES[axis];
      });
      render();
    });

    // 防止頁面捲動
    document.addEventListener('touchmove', (e) => {
      if (e.target.tagName !== 'INPUT') {
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('resize', setupHighResCanvases);
    window.addEventListener('orientationchange', () => {
      setTimeout(setupHighResCanvases, 60);
    });

    // 確保在 DOM 與樣式套用後立即繪製，並在視窗載入完成時再次校準解析度
    setupHighResCanvases();
    window.addEventListener('load', setupHighResCanvases);
  </script>
</body>
</html>
